name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    # ubuntu-latest (26.04) has no Python 3.9 build for setup-python; 24.04 has.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the skill's scripts promise (older macOS system python); 3.13 and 3.14 are current
        # (3.14 changed html.parser internals that scan_url.py subclasses).
        python: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Tests (including the leak check of test_packaging.py)
        # The source knowledge base is private: tests that need it skip without LEGAL_KIT_WIKI.
        run: python -m pytest tools/tests -q -p no:cacheprovider
      - name: Scripts answer --help
        run: |
          for script in skills/legal-kit/scripts/*.py; do
            case "$(basename "$script")" in _*) continue ;; esac
            python "$script" --help > /dev/null
          done
      - name: Golden reports pass check_run
        run: |
          python evals/check_run.py evals/golden/landing-static
          python evals/check_run.py evals/golden/saas-nest-react
