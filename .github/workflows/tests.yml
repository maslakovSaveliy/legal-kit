name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the skill's scripts promise (system python on macOS); 3.13 is current.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Tests (including the leak check of test_packaging.py)
        # The source knowledge base is private: tests that need it skip without LEGAL_KIT_WIKI.
        run: python -m pytest tools/tests -q -p no:cacheprovider
      - name: Scripts answer --help
        run: |
          for script in skills/legal-kit/scripts/*.py; do
            case "$(basename "$script")" in _*) continue ;; esac
            python "$script" --help > /dev/null
          done
      - name: Golden reports pass check_run
        run: |
          python evals/check_run.py evals/golden/landing-static
          python evals/check_run.py evals/golden/saas-nest-react
